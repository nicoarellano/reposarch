<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IFC.js</title>
    <link rel="stylesheet" href="../../assets/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@3.3.0/dist/maplibre-gl.css"
    />
    <style>
      .airport-popup .maplibregl-popup-content {
        border-radius: 14px;
        border: 1px solid rgba(0, 0, 0, 0.08);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        padding: 0;
        min-width: 240px;
        overflow: hidden;
      }

      .airport-popup .maplibregl-popup-tip {
        border-top-color: #ffffff;
      }

      .airport-card {
        background: linear-gradient(180deg, #ffffff 0%, #f4f7fb 100%);
        color: #1f2937;
      }

      .airport-card-header {
        background: #0f172a;
        color: #e2e8f0;
        padding: 0.55rem 0.9rem;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .airport-card-body {
        padding: 0.8rem 0.9rem 0.95rem;
      }

      .airport-card-title {
        margin: 0;
        font-size: 1rem;
        font-weight: 700;
        line-height: 1.2;
      }

      .airport-card-meta {
        margin: 0.35rem 0 0.7rem;
        font-size: 0.85rem;
        color: #334155;
      }

      .airport-card-image {
        width: 100%;
        border-radius: 10px;
        border: 1px solid rgba(15, 23, 42, 0.1);
        display: block;
      }

      .map-legend {
        position: absolute;
        top: 14px;
        right: 14px;
        z-index: 5;
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-radius: 10px;
        padding: 10px 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
        backdrop-filter: blur(2px);
        color: #111;
      }

      .map-legend-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        line-height: 1.2;
        font-weight: 600;
      }

      .map-legend-icon {
        width: 18px;
        height: 18px;
        display: inline-block;
      }

      .map-legend-icon svg {
        width: 100%;
        height: 100%;
        display: block;
        filter: drop-shadow(0 0 1px rgba(0, 0, 0, 0.75));
      }

      .map-legend-source {
        margin-top: 4px;
        font-size: 11px;
        line-height: 1.2;
        color: #333;
      }
    </style>
  </head>

  <body class="hide-overflow">
    <div class="hide-overflow canvas">
      <div id="map-f2024" style="width: 100%; height: 100%"></div>
      <div class="map-legend" aria-label="Map legend">
        <div class="map-legend-row">
          <span class="map-legend-icon" aria-hidden="true">
            <svg viewBox="0 0 15 15" xmlns="http://www.w3.org/2000/svg">
              <path
                fill="#2f2f2f"
                d="M15,6.8182L15,8.5l-6.5-1l-0.3182,4.7727L11,14v1l-3.5-0.6818L4,15v-1l2.8182-1.7273L6.5,7.5L0,8.5V6.8182L6.5,4.5v-3c0,0,0-1.5,1-1.5s1,1.5,1,1.5v2.8182L15,6.8182z"
              />
            </svg>
          </span>
          <span>Canadian Airports</span>
        </div>
        <div class="map-legend-source">* source Natural Resources Canada</div>
      </div>
      <script src="./main.js" type="module"></script>
    </div>
    <div class="simple-card-container bottom">
      <div class="toolbar">
        <a class="button circular" id="map-view" title="Map view">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path
              id="map-icon"
              d="M17.545 5l-5.545-4-5.545 4-6.455-4v18l6.455 4 5.545-4 5.545 4 6.455-4v-18l-6.455 4zm-10.545 2.073l4-2.886v13.068l-4 2.885v-13.067zm6-2.886l4 2.886v13.068l-4-2.885v-13.069zm-11 .405l4 2.479v13.294l-4-2.479v-13.294zm20 13.295l-4 2.479v-13.295l4-2.479v13.295z"
            />
          </svg>
        </a>
        <a class="button circular" id="go-to" title="Go to site">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path
              id="go-to-icon"
              d="M24.012 20h-20v-2h20v2zm-2.347-5.217c-.819 1.083-2.444 1.284-3.803 1.2-1.142-.072-10.761-1.822-11.186-1.939-1.917-.533-3.314-1.351-4.276-2.248-.994-.927-1.557-1.902-1.676-2.798l-.724-4.998 3.952.782 2.048 2.763 1.886.386-1.344-4.931 4.667 1.095 4.44 5.393 2.162.51c1.189.272 2.216.653 3.181 1.571.957.911 1.49 2.136.673 3.214zm-3.498-2.622c-.436-.15-3.221-.781-3.717-.892l-4.45-5.409-.682-.164 1.481 4.856-5.756-1.193-2.054-2.773-.772-.19.486 2.299c.403 1.712 2.995 3.155 4.575 3.439 1.06.192 8.89 1.612 9.959 1.773.735.105 2.277.214 2.805-.302l.003-.002c-.268-.652-1.214-1.213-1.878-1.442z"
            />
          </svg>
        </a>
      </div>

      <script src="https://unpkg.com/maplibre-gl@3.3.0/dist/maplibre-gl.js"></script>
      <script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
      <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
    </div>
  </body>
</html>
