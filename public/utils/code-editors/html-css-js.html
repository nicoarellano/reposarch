<!DOCTYPE html>
<html>
  <head>
    <title>Real-Time Editor</title>
    <link rel="stylesheet" type="text/css" href="styles.css" />
    <script defer type="text/javascript" src="app.js"></script>
    <!-- <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script> -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/split.js/1.0.0/split.min.js"
      integrity="sha512-tTsZnBXEzNdEaqUO9Ok8fUofS73xieiBa54pD/sxOSvayIgItM9MmEM0CnUjA13LDnJT22sfwmjf20+Bo2174g=="
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <style>
      .textarea-wrapper {
        position: relative;
        height: 33%;
      }
    </style>
    <div class="container split">
      <!-- Text area for Html Code  -->
      <div class="textarea-wrapper">
        <button class="example-btn" onclick="insertHtmlExample()">✓</button>
        <textarea
          style="height: 100%"
          id="htmlCode"
          placeholder="Type HTML code here"
          spellcheck="false"
          oninput="update(0)"
          onkeydown="if(event.keyCode===9){var v=this.value,s=this.selectionStart,e=this.selectionEnd;this.value=v.substring(0, s)+'\t'+v.substring(e);this.selectionStart=this.selectionEnd=s+1;return false;}if(event.keyCode==8){update(1);}"
        ></textarea>
      </div>
      <!-- Text area for Css Code  -->
      <textarea
        style="height: 33.333%"
        id="cssCode"
        placeholder="Type CSS code here"
        spellcheck="false"
        oninput="update(0)"
        onkeydown="if(event.keyCode===9){var v=this.value,s=this.selectionStart,e=this.selectionEnd;this.value=v.substring(0, s)+'\t'+v.substring(e);this.selectionStart=this.selectionEnd=s+1;return false;}if(event.keyCode==8){update(1);}"
      ></textarea>
      <!-- Text area for Javascript Code  -->
      <textarea
        style="height: 33.333%"
        id="javascriptCode"
        spellcheck="false"
        placeholder="Type JavaScript code here"
        oninput="update(0)"
        onkeydown="if(event.keyCode===9){var v=this.value,s=this.selectionStart,e=this.selectionEnd;this.value=v.substring(0, s)+'\t'+v.substring(e);this.selectionStart=this.selectionEnd=s+1;return false;}if(event.keyCode==8){update(1);}"
      ></textarea>
    </div>
    <div class="iframe-container split">
      <iframe id="viewer"></iframe>
    </div>
    <script>
      function insertHtmlExample() {
        const htmlCode = document.getElementById('htmlCode');
        const cssCode = document.getElementById('cssCode');
        const javascriptCode = document.getElementById('javascriptCode');

        htmlCode.value = window.htmlBoilerplate || '';
        cssCode.value = window.cssBoilerplate || '';
        javascriptCode.value = window.jsBoilerplate || '';
        htmlCode.oninput({ target: htmlCode });
      }
    </script>
</html>
